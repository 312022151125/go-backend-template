name: Bug report
description: "Report a bug"
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: Verification
      description: Before submitting, check the options below to confirm you have read and understood these requirements; otherwise this issue may be closed.
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true

  - type: textarea
    attributes:
      label: Description
      description: Provide a detailed description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: List the steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Paste relevant logs below.
      render: shell