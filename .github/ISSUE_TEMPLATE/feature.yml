name: Feature request
description: Suggest an improvement for this project
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: Verification
      description: Before submitting, check the options below to confirm you have read and understood these requirements; otherwise this issue may be closed.
      options:
        - label: I read README.md and confirmed this feature is not already implemented
          required: true
        - label: I searched existing issues and did not find this feature request
          required: true
  - type: textarea
    attributes:
      label: Description
      description: Provide a clear, detailed description of the feature (avoid vague wording).
    validations:
      required: true