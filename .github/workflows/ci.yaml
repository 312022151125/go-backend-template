name: ci

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build web static
        run: bash scripts/web-build.sh

      - name: Verify static shell
        run: test -f static/index.html

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o /dev/null .