name: release

on:
  workflow_run:
    workflows:
      - changelog
    types:
      - completed

permissions:
  contents: write

jobs:
  build-release-and-docker:
    name: build-release-and-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    env:
      GOFLAGS: -buildvcs=false
      RELEASE_LINUX_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7,linux/386
      IMAGE_NAME: go-backend-template
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: bash scripts/build.sh release

      - name: Get latest tag
        id: tag
        run: echo "TAG_NAME=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/archives/*
          prerelease: false
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: ${{ steps.tag.outputs.TAG_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKER_USERNAME / DOCKER_PASSWORD not set — release archives upload still runs; Docker push skipped."
          fi

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push production image (Alpine)
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/dockerfile/Dockerfile.alpine
          push: true
          platforms: ${{ env.RELEASE_LINUX_PLATFORMS }}
          tags: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.TAG_NAME }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release