name: docker-develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    env:
      DOCKER_DEVELOP_PLATFORMS: linux/amd64
      GOFLAGS: -buildvcs=false
      IMAGE_NAME: go-backend-template
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build Docker binaries
        run: bash scripts/build.sh docker-binaries --platform "${DOCKER_DEVELOP_PLATFORMS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push develop image (Alpine)
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/dockerfile/Dockerfile.alpine
          push: true
          platforms: ${{ env.DOCKER_DEVELOP_PLATFORMS }}
          tags: docker.io/${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:develop
          provenance: false
          sbom: false
          cache-from: type=gha,scope=develop
          cache-to: type=gha,mode=max,scope=develop

      - name: Verify Docker image build (no push)
        if: env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/dockerfile/Dockerfile.alpine
          push: false
          load: true
          platforms: ${{ env.DOCKER_DEVELOP_PLATFORMS }}
          tags: go-backend-template:develop-ci
          provenance: false
          sbom: false