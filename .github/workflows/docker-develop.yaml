name: docker-develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      DOCKER_DEVELOP_PLATFORMS: linux/amd64
      GOFLAGS: -buildvcs=false
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Test
        run: go test ./...

      - name: Build web static
        run: bash scripts/web-build.sh

      - name: Build Docker binaries
        run: bash scripts/build.sh docker-binaries --platform "${DOCKER_DEVELOP_PLATFORMS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push develop image (Alpine)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/dockerfile/Dockerfile.alpine
          push: true
          platforms: ${{ env.DOCKER_DEVELOP_PLATFORMS }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
          provenance: false
          sbom: false
          cache-from: type=gha,scope=develop
          cache-to: type=gha,mode=max,scope=develop